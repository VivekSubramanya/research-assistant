name: Python Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install streamlit pandas requests feedparser faiss-cpu numpy sentence-transformers beautifulsoup4 nltk
      - name: Run tests
        run: pytest -q
