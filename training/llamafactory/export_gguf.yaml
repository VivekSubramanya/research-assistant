### LLaMA-Factory export config for Qwen2.5-14B-Instruct LoRA adapter
###
### This merges the LoRA adapter back into the base model and saves it in
### Hugging Face format. To convert to GGUF for Ollama, use llama.cpp's
### convert_hf_to_gguf.py script (see README.md).
###
### Usage:
###   cd <path-to-LLaMA-Factory>
###   llamafactory-cli export path/to/this/file.yaml

### model
model_name_or_path: Qwen/Qwen2.5-14B-Instruct
# If you have a local download, use the absolute path instead:
# model_name_or_path: C:/models/Qwen2.5-14B-Instruct

adapter_name_or_path: ./saves/qwen2.5-14b-lora-research-assistant

### export
template: qwen
finetuning_type: lora
export_dir: ./models/qwen2.5-14b-research-assistant-merged
export_size: 2
export_device: cpu
export_legacy_format: false
